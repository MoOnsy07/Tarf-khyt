<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<meta name="robots" content="noindex, nofollow">

<style>
.ad-wrap{max-width:980px;margin:0 auto;padding:34px 16px 70px}.ad-back{display:inline-flex;color:var(--ink-dim);text-decoration:none;font-size:13px;margin-bottom:22px}.ad-back:hover{color:var(--amber)}
.ad-head{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:22px;margin-bottom:14px}.ad-head h1{margin:0 0 5px;font-size:28px}.ad-head p{margin:0;color:var(--ink-dim);font-size:13px}.ad-refresh-btn{margin:0 0 14px}
.ad-section{background:linear-gradient(135deg,rgba(224,164,88,.08),rgba(255,255,255,.018));border:1px solid var(--line);border-radius:8px;padding:15px;margin-bottom:22px}.ad-section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}.ad-section-title{font-weight:900;font-size:17px}.ad-section-sub{color:var(--ink-dim);font-size:11.5px;margin-top:3px}
.ad-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.ad-stat{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:14px;text-align:center}.ad-stat .num{font-family:'JetBrains Mono',monospace;font-size:23px;font-weight:900;color:var(--amber)}.ad-stat .lbl{font-size:10.5px;color:var(--ink-dim);margin-top:4px;line-height:1.5}.ad-foot{display:flex;gap:16px;flex-wrap:wrap;color:var(--ink-dim);font-size:10.5px;margin-top:10px}
.ad-table-wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px}table.ad-table{width:100%;border-collapse:collapse;font-size:13px;min-width:680px}table.ad-table th{text-align:right;padding:12px 14px;color:var(--amber);border-bottom:1px solid var(--line);white-space:nowrap}table.ad-table td{padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}.ad-case-title{font-weight:700}.ad-case-no{color:var(--ink-dim);font-size:10.5px;font-family:'JetBrains Mono',monospace}.ad-num{text-align:center;font-family:'JetBrains Mono',monospace}.ad-loading,.ad-error,.ad-empty{text-align:center;padding:30px 12px;color:var(--ink-dim)}.ad-error{color:#e08a7c}
@media(max-width:700px){.ad-summary{grid-template-columns:1fr 1fr}.ad-head h1{font-size:23px}}
</style>
</head>
<body>
<div class="grain"></div><div class="scan"></div>
<div class="ad-wrap">
<a href="index.html" class="ad-back mono">→ رجوع للأرشيف</a>
<div class="ad-head"><h1>لوحة <span class="accent">المتابعة</span></h1><p>إحصائيات القضايا ونسخة Android في مكان واحد.</p></div>
<button class="btn ghost mono ad-refresh-btn" id="ad-refresh">↻ تحديث الأرقام</button>
<section class="ad-section" id="android-box"><div class="ad-loading mono">بيجيب أرقام Android...</div></section>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const ADMIN_SUPABASE_URL='https://meynspmfkkedhqhffsqk.supabase.co';
const ADMIN_SUPABASE_KEY='sb_publishable_uAUBrJE76udggvmbU95DVQ_HYDoyEB9';
const adminSb=window.supabase.createClient(ADMIN_SUPABASE_URL,ADMIN_SUPABASE_KEY);
const CASE_META={
'93rd-minute':['الدقيقة 93','CASE 001'],'wedding-gold':['دهب الفرح','CASE 002'],'buffalo-case':['قضية الجاموسة','CASE 003'],'dark-testimony':['شهادة في العتمة','CASE 004'],'leaked-video':['قضية الفيديو المسرّب','CASE 005'],'missing-bride':['قضية العروسة المفقودة','CASE 006'],'final-testament':['الوصية الأخيرة','CASE 007'],'forged-canvas':['اللوحة المزيفة','CASE 008'],'ghost-author':['القلم الخفي','CASE 009'],'last-dish':['الطبخة الأخيرة','CASE 010'],'exam-leak':['ورقة الامتحان','CASE 011'],'lost-wallet':['المحفظة المفقودة','CASE 012'],'fake-audio':['التسجيل المفبرك','CASE 013'],'false-rumor':['الوشاية','CASE 014'],'vanished-wife':['اختفاء منى','CASE 015'],'bribery':['قبول بالواسطة','CASE 016'],'illusion-startup':['مشروع الوهم','CASE 017'],'hit-and-run':['حادثة الطريق','CASE 018'],'charity-funds':['تبرعات في الهوا','CASE 019'],'var-conspiracy':['الجون اللي ما اتحسبش','CASE 020'],'last-rehearsal':['آخر بروفة','CASE 021'],'number-19':['القميص رقم 19','CASE 022'],'deleted-scene':['المشهد المحذوف','CASE 023'],'no-witness-night':['ليلة من غير شاهد','CASE 024'],'room-307':['باب 307','CASE 025'],'shifting-painting':['اللوحة اللي بتتغير','CASE 026'],'role-of-lifetime':['دور العمر','CASE 028'],'last-call':['آخر مكالمة','CASE 029'],'red-thread':['خيط أحمر','CASE 030'],'flat-12b':['الشقة 12 ب','CASE 031'],'suspicious-transfer':['تحويل مشبوه','CASE 032'],'mud-print':['بصمة في الوحل','CASE 033'],'opening-night':['ليلة الافتتاح','CASE 034'],'vault-key':['مفتاح الخزنة','CASE 035'],'recorded-voice':['الصوت المسجل','CASE 036'],'old-estate':['العزبة القديمة','CASE 037'],'dating-app':['تطبيق التعارف','CASE 038'],'behind-scenes':['كواليس البرنامج','CASE 039'],'finish-line':['خط النهاية','CASE 040'],'forged-will':['الوصية المزورة','CASE 041'],'dawn-club':['نادي الفجر','CASE 042'],'warehouse-fire':['حريق المخزن','CASE 043'],'last-update':['آخر تحديث','CASE 044'],'old-photo':['صورة قديمة','CASE 045'],'secret-clinic':['العيادة السرية','CASE 046'],'dawn-call':['مكالمة الفجر','CASE 047'],'last-bell':['الجرس الأخير','CASE 048'],'grandma-ring':['خاتم الجدة','CASE 049'],'nile-cruise':['الرحلة النيلية','CASE 050'],'closed-file':['ملف مغلق','CASE 051'],'one-comment':['تعليق واحد','CASE 052'],'last-laugh':['ضحكة أخيرة','CASE 053'],'missing-twin':['التوأم المفقود','CASE 054'],'overbilled':['فاتورة زيادة','CASE 055'],'second-face':['الوش التاني','CASE 056'],'broken-faucet':['صنبور مكسور','CASE 057'],'postponed-engagement':['خطوبة مؤجلة','CASE 058'],'secret-recipe':['الوصفة السرية','CASE 059'],'coded-message':['الرسالة المشفرة','CASE 060'],'last-episode':['الحلقة الأخيرة','FILE NO. 0417']};
function esc(v){const d=document.createElement('div');d.textContent=v==null?'':String(v);return d.innerHTML}
function fmt(v){if(!v)return '—';try{return new Date(v).toLocaleString('ar-EG',{dateStyle:'short',timeStyle:'short'})}catch(e){return '—'}}
async function loadAndroid(){const box=document.getElementById('android-box');box.innerHTML='<div class="ad-loading mono">بيجيب أرقام Android...</div>';try{const {data,error}=await adminSb.rpc('get_android_app_stats');if(error)throw error;const r=Array.isArray(data)?data[0]:data;if(!r)throw new Error('No Android stats');const clicks=Number(r.total_download_clicks)||0,unique=Number(r.unique_downloaders)||0,installs=Number(r.installs)||0,conv=unique?Math.round(installs/unique*100):0;box.innerHTML=`<div class="ad-section-head"><div><div class="ad-section-title">📱 Android APK</div><div class="ad-section-sub">العداد محفوظ في Supabase ومش بيتصفر مع إصدار APK جديد.</div></div><div class="mono" style="color:var(--ink-dim);font-size:11px">تحميل → فتح ${conv}%</div></div><div class="ad-summary"><div class="ad-stat"><div class="num">${clicks}</div><div class="lbl">ضغطات تحميل APK</div></div><div class="ad-stat"><div class="num">${unique}</div><div class="lbl">أجهزة ضغطت تحميل</div></div><div class="ad-stat"><div class="num">${installs}</div><div class="lbl">أول فتح فعلي للتطبيق</div></div><div class="ad-stat"><div class="num">${Number(r.installs_7d)||0}</div><div class="lbl">تثبيتات آخر 7 أيام</div></div><div class="ad-stat"><div class="num">${Number(r.active_7d)||0}</div><div class="lbl">نشطين آخر 7 أيام</div></div><div class="ad-stat"><div class="num">${Number(r.active_30d)||0}</div><div class="lbl">نشطين آخر 30 يوم</div></div><div class="ad-stat"><div class="num">${Number(r.total_app_opens)||0}</div><div class="lbl">إجمالي فتحات التطبيق</div></div><div class="ad-stat"><div class="num">${conv}%</div><div class="lbl">نسبة التحويل</div></div></div><div class="ad-foot"><span>آخر تحميل: ${esc(fmt(r.last_download_at))}</span><span>آخر فتح تطبيق: ${esc(fmt(r.last_app_open_at))}</span></div>`}catch(e){console.error(e);box.innerHTML='<div class="ad-error mono">تعذر تحميل أرقام Android: '+esc(e.message||e)+'</div>'}}
async function loadCases(){const root=document.getElementById('ad-root');root.innerHTML='<div class="ad-loading mono">بيجيب أرقام القضايا...</div>';try{const {data,error}=await adminSb.rpc('get_case_stats');if(error)throw error;const rows=data||[];if(!rows.length){root.innerHTML='<div class="ad-empty mono">مفيش بيانات قضايا لسه.</div>';return}let started=0,done=0,good=0,dropped=0;rows.forEach(r=>{started+=Number(r.started_count)||0;done+=Number(r.completed_count)||0;good+=Number(r.good_count)||0;dropped+=Number(r.dropped_count)||0});const body=rows.map(r=>{const m=CASE_META[r.case_id]||[r.case_id,''];const s=Number(r.started_count)||0,c=Number(r.completed_count)||0,d=Number(r.dropped_count)||0,rate=s?Math.round(c/s*100):0;return `<tr><td><div class="ad-case-title">${esc(m[0])}</div><div class="ad-case-no">${esc(m[1])}</div></td><td class="ad-num">${s}</td><td class="ad-num">${c}</td><td class="ad-num">${Number(r.good_count)||0}</td><td class="ad-num">${Number(r.partial_count)||0}</td><td class="ad-num">${Number(r.bad_count)||0}</td><td class="ad-num">${d}</td><td class="ad-num">${rate}%</td></tr>`}).join('');root.innerHTML=`<section class="ad-section"><div class="ad-section-title" style="margin-bottom:12px">🕵️ القضايا</div><div class="ad-summary"><div class="ad-stat"><div class="num">${started}</div><div class="lbl">إجمالي مرات اللعب</div></div><div class="ad-stat"><div class="num">${done}</div><div class="lbl">إجمالي مرات الإنهاء</div></div><div class="ad-stat"><div class="num">${good}</div><div class="lbl">نجاح كامل</div></div><div class="ad-stat"><div class="num">${dropped}</div><div class="lbl">خرجوا قبل النهاية</div></div></div></section><div class="ad-table-wrap"><table class="ad-table"><thead><tr><th>القضية</th><th>لعبها</th><th>خلّصها</th><th>نجاح</th><th>جزئي</th><th>غلط</th><th>خرج</th><th>الإنهاء</th></tr></thead><tbody>${body}</tbody></table></div>`}catch(e){console.error(e);root.innerHTML='<div class="ad-error mono">تعذر تحميل إحصائيات القضايا.</div>'}}
function refresh(){loadAndroid();loadCases()}
document.getElementById('ad-refresh').addEventListener('click',refresh);refresh();
</script>
</body>
</html>
