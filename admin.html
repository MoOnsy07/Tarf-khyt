<style>
  .ad-wrap{ max-width:980px; margin:0 auto; padding:34px 16px 70px; }
  .ad-back{
    display:inline-flex; align-items:center; gap:6px; color:var(--ink-dim);
    text-decoration:none; font-size:13px; margin-bottom:22px; transition:.15s;
  }
  .ad-back:hover{ color:var(--amber); }

  .ad-summary{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:26px 0 22px; }
  @media (max-width:640px){ .ad-summary{ grid-template-columns:1fr 1fr; } }
  .ad-stat{ background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:16px; text-align:center; }
  .ad-stat .num{ font-family:'JetBrains Mono', monospace; font-size:24px; font-weight:800; color:var(--amber); text-shadow:var(--gold-glow); }
  .ad-stat .lbl{ font-size:11.5px; color:var(--ink-dim); margin-top:4px; }

  .ad-table-wrap{ overflow-x:auto; background:var(--panel); border:1px solid var(--line); border-radius:6px; }
  table.ad-table{ width:100%; border-collapse:collapse; font-size:13.5px; min-width:680px; }
  table.ad-table th{
    text-align:right; padding:12px 14px; color:var(--amber); font-size:12px;
    font-family:'JetBrains Mono', monospace; border-bottom:1px solid var(--line);
    white-space:nowrap;
  }
  table.ad-table td{ padding:11px 14px; border-bottom:1px solid var(--line); color:var(--ink); white-space:nowrap; }
  table.ad-table tr:last-child td{ border-bottom:none; }
  table.ad-table tr:hover td{ background:var(--panel-2); }
  .ad-case-title{ font-weight:700; }
  .ad-case-no{ color:var(--ink-dim); font-size:11px; font-family:'JetBrains Mono', monospace; }
  .ad-num{ font-family:'JetBrains Mono', monospace; text-align:center; }
  .ad-good{ color:#8fd6a4; }
  .ad-partial{ color:var(--amber); }
  .ad-bad{ color:#e08a7c; }
  .ad-dropped{ color:var(--ink-dim); }
  .ad-rate{ font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--ink-dim); }

  .ad-loading, .ad-error, .ad-empty{ text-align:center; padding:40px 16px; color:var(--ink-dim); font-size:14px; }
  .ad-error{ color:#e08a7c; }

  .ad-refresh-btn{ margin-bottom:14px; }
</style>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="supabase-client.js"></script>

<script>
(function(){
  const root = document.getElementById('ad-root');
  const refreshBtn = document.getElementById('ad-refresh');

  const caseById = {};
  CASES_REGISTRY.forEach(c => { caseById[c.id] = c; });

  function escapeHTML(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  async function load(){
    root.innerHTML = '<div class="ad-loading mono">بيجيب الأرقام من Supabase...</div>';
    let rows;
    try{
      rows = await fetchCaseStats();
    }catch(e){
      root.innerHTML = '<div class="ad-error mono">حصل خطأ في الاتصال. تأكد إنك شغّلت CASE_EVENTS_SETUP.sql في Supabase.</div>';
      return;
    }
    if(!rows || !rows.length){
      root.innerHTML = '<div class="ad-empty mono">مفيش بيانات لسه. الأرقام هتبدأ تظهر أول ما لاعب يفتح قضية بعد رفع التحديث ده.</div>';
      return;
    }

    let totalStarted = 0, totalCompleted = 0, totalDropped = 0, totalGood = 0;
    rows.forEach(r=>{
      totalStarted += Number(r.started_count)||0;
      totalCompleted += Number(r.completed_count)||0;
      totalDropped += Number(r.dropped_count)||0;
      totalGood += Number(r.good_count)||0;
    });

    const rowsHTML = rows.map(r=>{
      const c = caseById[r.case_id];
      const title = c ? c.title : r.case_id;
      const caseNo = c ? c.caseNo : '';
      const started = Number(r.started_count)||0;
      const completed = Number(r.completed_count)||0;
      const dropped = Number(r.dropped_count)||0;
      const completionRate = started ? Math.round((completed/started)*100) : 0;
      return `
        <tr>
          <td>
            <div class="ad-case-title">${escapeHTML(title)}</div>
            <div class="ad-case-no">${escapeHTML(caseNo)}</div>
          </td>
          <td class="ad-num">${started}</td>
          <td class="ad-num">${completed}</td>
          <td class="ad-num ad-good">${Number(r.good_count)||0}</td>
          <td class="ad-num ad-partial">${Number(r.partial_count)||0}</td>
          <td class="ad-num ad-bad">${Number(r.bad_count)||0}</td>
          <td class="ad-num ad-dropped">${dropped}</td>
          <td class="ad-rate">${started ? completionRate + '%' : '—'}</td>
        </tr>
      `;
    }).join('');

    root.innerHTML = `
      <div class="ad-summary">
        <div class="ad-stat"><div class="num mono">${totalStarted}</div><div class="lbl">إجمالي مرات اللعب</div></div>
        <div class="ad-stat"><div class="num mono">${totalCompleted}</div><div class="lbl">إجمالي مرات الإنهاء</div></div>
        <div class="ad-stat"><div class="num mono">${totalGood}</div><div class="lbl">نجاح كامل</div></div>
        <div class="ad-stat"><div class="num mono">${totalDropped}</div><div class="lbl">طلعوا من غير ما يخلّصوا</div></div>
      </div>

      <div class="ad-table-wrap">
        <table class="ad-table">
          <thead>
            <tr>
              <th>القضية</th>
              <th>لعبها</th>
              <th>خلّصها</th>
              <th>نجاح</th>
              <th>جزئي</th>
              <th>غلط</th>
              <th>طلع منها</th>
              <th>نسبة الإنهاء</th>
            </tr>
          </thead>
          <tbody>${rowsHTML}</tbody>
        </table>
      </div>
    `;
  }

  refreshBtn.addEventListener('click', load);
  load();
})();
</script>
