name: Godot Last Seen Prototype

on:
  push:
    branches:
      - godot-last-seen-prototype
    paths:
      - 'godot/last-seen-prototype/**'
      - '.github/workflows/godot-last-seen-check.yml'
  pull_request:
    paths:
      - 'godot/last-seen-prototype/**'

permissions:
  contents: write

jobs:
  godot-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bake Arabic font into project
        run: |
          mkdir -p godot/last-seen-prototype/fonts
          curl -L --fail --retry 3 \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/notosansarabic/NotoSansArabic%5Bwdth%2Cwght%5D.ttf' \
            -o godot/last-seen-prototype/fonts/NotoSansArabic.ttf
          test "$(stat -c%s godot/last-seen-prototype/fonts/NotoSansArabic.ttf)" -gt 100000

      - name: Setup Godot 4
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Verify Godot
        run: godot --version

      - name: Import project
        working-directory: godot/last-seen-prototype
        run: godot --headless --import

      - name: Parse main script
        working-directory: godot/last-seen-prototype
        run: godot --headless --script res://scripts/main.gd --check-only

      - name: Export Web build
        working-directory: godot/last-seen-prototype
        run: |
          mkdir -p build/web
          godot --headless --export-release Web build/web/index.html

      - name: Upload Web prototype
        uses: actions/upload-artifact@v4
        with:
          name: last-seen-godot-web
          path: godot/last-seen-prototype/build/web/

      - name: Publish browser preview
        if: github.ref == 'refs/heads/godot-last-seen-prototype'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          publish_dir="$RUNNER_TEMP/godot-preview"
          mkdir -p "$publish_dir"
          cp -a godot/last-seen-prototype/build/web/. "$publish_dir/"
          cd "$publish_dir"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b godot-web-preview
          git add .
          git commit -m "deploy Last Seen Godot preview"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin godot-web-preview
