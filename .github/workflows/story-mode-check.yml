name: Story Mode Check

on:
  push:
    branches:
      - story-mode-last-seen
    paths:
      - 'v2/story*.js'
      - 'v2/case-last-seen.js'
      - 'v2/last-seen-*.js'
      - 'v2/last-seen-*.css'
      - 'v2/story.html'
      - 'v2/story.css'
      - 'v2/story-cinematic.css'
      - '.github/workflows/story-mode-check.yml'
  pull_request:
    paths:
      - 'v2/story*.js'
      - 'v2/case-last-seen.js'
      - 'v2/last-seen-*.js'
      - 'v2/last-seen-*.css'
      - 'v2/story.html'
      - 'v2/story.css'
      - 'v2/story-cinematic.css'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Story Mode JavaScript syntax
        run: |
          node --check v2/story-engine.js
          node --check v2/story-cinematic.js
          node --check v2/case-last-seen.js
          node --check v2/last-seen-assets.js
          node --check v2/validate-last-seen.js
      - name: Validate Last Seen story graph
        run: node v2/validate-last-seen.js
      - name: Check Story Mode shell references
        run: |
          grep -q './last-seen-scenes.css' v2/story.html
          grep -q './story-cinematic.css' v2/story.html
          grep -q './last-seen-assets.js' v2/story.html
          grep -q './case-last-seen.js' v2/story.html
          grep -q './story-engine.js' v2/story.html
          grep -q './story-cinematic.js' v2/story.html
          grep -q './story.css' v2/story.html
