name: unpack discovery images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and unpack discovery images
        run: |
          base64 --decode .tmp/discovery20.zip > /tmp/discovery20-real.zip
          unzip -t /tmp/discovery20-real.zip
          unzip -o /tmp/discovery20-real.zip -d .
          rm -f .tmp/discovery20.zip
          rm -f .github/workflows/unpack-discovery-images.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add realistic discovery images"
          git push
