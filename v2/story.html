<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#050608" />
  <title>طرف خيط — آخر مُشاهد</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./story.css" />
  <link rel="stylesheet" href="./last-seen-scenes.css" />
  <link rel="stylesheet" href="./story-intro.css" />
  <link rel="stylesheet" href="./story-cinematic.css" />
  <link rel="stylesheet" href="./story-welcome.css" />
  <link rel="stylesheet" href="./last-seen-clarity.css" />
</head>
<body>
  <div id="storyApp" class="story-app">
    <header id="storyHeader" class="story-header">
      <div>
        <div id="caseEyebrow" class="case-eyebrow">طرف خيط · وضع القصة</div>
        <h1 id="caseTitle">آخر مُشاهد</h1>
      </div>
      <div class="header-meta">
        <span id="chapterLabel">الفصل الأول</span>
        <span id="saveState" class="save-state">محفوظ</span>
      </div>
    </header>

    <main id="stage" class="story-stage" aria-live="polite"></main>

    <div id="storyToast" class="story-toast" role="status" aria-live="polite"></div>
    <div id="systemFlash" class="system-flash" aria-hidden="true"></div>

    <aside id="debugPanel" class="debug-panel hidden" aria-label="Story Debugger">
      <div class="debug-head">
        <strong>Story Debugger</strong>
        <button id="debugClose" type="button">×</button>
      </div>
      <label>انتقل لمشهد</label>
      <div class="debug-row">
        <input id="debugJumpInput" type="text" placeholder="node-id" />
        <button id="debugJumpBtn" type="button">انتقل</button>
      </div>
      <button id="debugResetBtn" type="button" class="debug-danger">مسح الحفظ وإعادة البداية</button>
      <pre id="debugState"></pre>
    </aside>
  </div>

  <script src="./last-seen-assets.js"></script>
  <script src="./case-last-seen.js"></script>
  <script src="./story-intro.js"></script>
  <script src="./story-engine.js"></script>
  <script src="./story-cinematic.js"></script>
  <script src="./story-welcome.js"></script>
  <script src="./story-clarity.js"></script>
</body>
</html>
