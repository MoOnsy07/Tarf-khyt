<style>

  :root {
    --void: #181c25;
    --panel: #212734;
    --panel-2: #2a3140;
    --line: #3a4254;
    --amber: #e0a458;
    --amber-dim: #8a6a3e;
    --thread: #c65a4e;
    --thread-dim: #7a3a33;
    --ink: #f0ece2;
    --ink-dim: #aab2c2;
    --gold: #f4c869;
    --gold-deep: #b8860b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--void);
    font-family: 'Tajawal', sans-serif;
    padding: 40px 16px;
  }

  .mono { font-family: 'JetBrains Mono', monospace; direction: ltr; display: inline-block; }

  /* منع لخبطة الأرقام والإنجليزي داخل صفحة RTL */
  .ltr-token, .tier-label-ltr, .amount {
    direction: ltr;
    unicode-bidi: isolate;
  }
  .ltr-token, .amount {
    display: inline-block;
    white-space: nowrap;
  }
  .tier-label-ltr {
    display: block;
    white-space: nowrap;
  }
  .tier-price {
    direction: ltr;
    unicode-bidi: isolate;
    white-space: nowrap;
  }

  /* البانر لما يتحط تحت لوجو الأرشيف */
  .bundle-home-banner {
    margin: 22px auto 30px;
  }

  .banner {
    max-width: 920px;
    margin: 0 auto;
    background: linear-gradient(160deg, #1c1712 0%, var(--void) 55%);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 36px 28px 30px;
    position: relative;
    overflow: hidden;
  }

  .fingerprint-bg {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 420px; height: 420px;
    opacity: 0.05;
    pointer-events: none;
  }
  .fingerprint-bg path { fill: none; stroke: var(--gold); stroke-width: 2; }

  .header {
    text-align: center;
    margin-bottom: 30px;
    position: relative;
    z-index: 2;
  }

  .eyebrow {
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--thread);
    font-weight: 700;
    text-transform: uppercase;
  }

  h1 {
    font-size: clamp(26px, 4vw, 36px);
    font-weight: 900;
    color: var(--ink);
    margin: 8px 0 6px;
  }

  .subtitle {
    color: var(--ink-dim);
    font-size: 14px;
  }

  .tiers {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0;
    position: relative;
    z-index: 2;
  }

  .thread-row {
    position: relative;
    height: 3px;
    margin: 0 -1px 22px;
    background: linear-gradient(90deg, var(--thread-dim) 0%, var(--thread) 50%, var(--gold) 100%);
    border-radius: 2px;
  }
  .thread-row::before, .thread-row::after {
    content: '';
    position: absolute;
    top: 50%; transform: translateY(-50%);
    width: 8px; height: 8px;
    border-radius: 50%;
  }
  .thread-row::before { right: -2px; background: var(--thread-dim); }
  .thread-row::after { left: -2px; background: var(--gold); box-shadow: 0 0 10px rgba(244,200,105,0.6); }

  .tier {
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 22px 16px 20px;
    text-align: center;
    position: relative;
  }
  .tier:not(:last-child) { border-left: none; }
  .tier:first-child { border-radius: 8px 0 0 8px; }
  .tier:last-child { border-radius: 0 8px 8px 0; }

  .tier.best {
    background: linear-gradient(160deg, #2a2415 0%, var(--panel) 60%);
    border-color: rgba(244,200,105,0.4);
    box-shadow: 0 0 0 1px rgba(244,200,105,0.25), 0 0 30px rgba(244,200,105,0.12);
    z-index: 1;
  }

  .best-stamp {
    position: absolute;
    top: -11px; left: 50%;
    transform: translateX(-50%) rotate(-3deg);
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-deep) 100%);
    color: #241a02;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 4px 12px;
    border-radius: 3px;
    box-shadow: 0 3px 10px rgba(184,134,11,0.4);
  }

  .tier-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--ink-dim);
    letter-spacing: 1px;
    margin-bottom: 6px;
  }

  .tier-label {
    font-size: 16px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 14px;
  }
  .tier.best .tier-label { color: var(--gold); }

  .tier-price {
    font-family: 'JetBrains Mono', monospace;
    font-size: 30px;
    font-weight: 700;
    color: var(--amber);
    line-height: 1;
    margin-bottom: 4px;
  }
  .tier.best .tier-price { color: var(--gold); }

  .tier-price small {
    font-family: 'Tajawal', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-dim);
  }

  .tier-per-case {
    font-size: 11px;
    color: var(--ink-dim);
    margin-bottom: 16px;
  }
  .tier-per-case .mono { color: var(--ink); font-weight: 700; }

  .tier-cta {
    display: inline-block;
    width: 100%;
    background: transparent;
    border: 1px solid var(--amber-dim);
    color: var(--amber);
    font-family: 'Tajawal', sans-serif;
    font-size: 13px;
    font-weight: 700;
    padding: 10px;
    border-radius: 4px;
    text-decoration: none;
    cursor: pointer;
    transition: 0.15s;
  }
  .tier-cta:hover { border-color: var(--amber); background: rgba(224,164,88,0.08); }
  .tier.best .tier-cta:hover { filter: brightness(1.08); }
  .tier.best .tier-cta {
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-deep) 100%);
    border: none;
    color: #241a02;
  }

  .footer-note {
    text-align: center;
    margin-top: 26px;
    font-size: 12px;
    color: var(--ink-dim);
    position: relative;
    z-index: 2;
  }
  .footer-note .thread-dot { color: var(--thread); }


  /* ===== Mobile package teaser + modal ===== */
  .bundle-mobile-teaser {
    display: none;
  }

  .bundle-mobile-modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: rgba(5, 7, 12, 0.78);
    backdrop-filter: blur(7px);
    padding: 18px 12px;
    overflow-y: auto;
  }

  .bundle-mobile-modal.open {
    display: flex;
    align-items: flex-start;
    justify-content: center;
  }

  .bundle-mobile-modal-inner {
    width: min(100%, 560px);
    margin: auto;
    position: relative;
  }

  .bundle-mobile-close {
    position: sticky;
    top: 0;
    margin: 0 0 10px auto;
    width: 40px;
    height: 40px;
    border: 1px solid var(--line);
    border-radius: 50%;
    background: #141922;
    color: var(--ink);
    font-size: 22px;
    font-family: inherit;
    cursor: pointer;
    z-index: 3;
    display: grid;
    place-items: center;
  }

  @media (max-width: 600px) {
    /* اخفي البانر الكامل تحت اللوجو على الموبايل */
    .bundle-home-banner {
      display: none !important;
    }

    /* الكارت الصغير البديل */
    .bundle-mobile-teaser {
      display: block;
      margin: 14px 14px 18px;
      border: 1px solid rgba(224,164,88,0.35);
      background:
        radial-gradient(circle at 85% 15%, rgba(244,200,105,0.12), transparent 34%),
        linear-gradient(145deg, #211c16 0%, #1b202a 100%);
      border-radius: 12px;
      padding: 14px 15px;
      cursor: pointer;
      box-shadow: 0 8px 26px rgba(0,0,0,0.24);
      text-align: right;
    }

    .bundle-mobile-teaser-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .bundle-mobile-teaser-title {
      font-size: 15px;
      font-weight: 900;
      color: var(--gold);
      margin-bottom: 3px;
    }

    .bundle-mobile-teaser-sub {
      font-size: 12px;
      color: var(--ink-dim);
      line-height: 1.55;
    }

    .bundle-mobile-teaser-arrow {
      flex: 0 0 auto;
      color: var(--amber);
      font-size: 20px;
      transform: rotate(180deg);
    }

    /* البانر داخل الـPopup يبقى مناسب للموبايل */
    .bundle-mobile-modal .banner {
      display: block !important;
      width: 100%;
      margin: 0;
      padding: 28px 14px 20px;
      border-radius: 12px;
    }

    .bundle-mobile-modal .header {
      margin-bottom: 22px;
    }

    .bundle-mobile-modal .tiers {
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .bundle-mobile-modal .tier,
    .bundle-mobile-modal .tier:first-child,
    .bundle-mobile-modal .tier:last-child {
      border-radius: 8px;
      border-left: 1px solid var(--line);
    }

    .bundle-mobile-modal .thread-row {
      display: none;
    }

    .bundle-mobile-modal .fingerprint-bg {
      width: 320px;
      height: 320px;
    }
  }

  @media (max-width: 600px) {
    .tiers { grid-template-columns: 1fr; gap: 14px; }
    .tier, .tier:first-child, .tier:last-child { border-radius: 8px; border-left: 1px solid var(--line); }
    .thread-row { display: none; }
  }

</style>

<script>
/* الباقات:
   - PC: البانر الكامل تحت لوجو "طرف الخيط"
   - Mobile: كارت صغير تحت اللوجو يفتح Popup بالباقات
*/
(function () {
  const appRoot = document.getElementById('app');
  const tpl = document.getElementById('bundleBannerTemplate');
  if (!appRoot || !tpl) return;

  function buildMobileModalIfNeeded() {
    let modal = document.getElementById('bundleMobileModal');
    if (modal) return modal;

    modal = document.createElement('div');
    modal.id = 'bundleMobileModal';
    modal.className = 'bundle-mobile-modal';
    modal.setAttribute('aria-hidden', 'true');

    const inner = document.createElement('div');
    inner.className = 'bundle-mobile-modal-inner';

    const close = document.createElement('button');
    close.type = 'button';
    close.className = 'bundle-mobile-close';
    close.setAttribute('aria-label', 'إغلاق الباقات');
    close.textContent = '×';

    const fragment = tpl.content.cloneNode(true);
    const banner = fragment.querySelector('.banner');

    inner.appendChild(close);
    if (banner) inner.appendChild(banner);
    modal.appendChild(inner);
    document.body.appendChild(modal);

    function closeModal() {
      modal.classList.remove('open');
      modal.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    }

    close.addEventListener('click', closeModal);

    modal.addEventListener('click', function (e) {
      if (e.target === modal) closeModal();
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && modal.classList.contains('open')) closeModal();
    });

    return modal;
  }

  function openMobileModal() {
    const modal = buildMobileModalIfNeeded();
    modal.classList.add('open');
    modal.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  }

  function placePackagesUnderLogo() {
    const hero = appRoot.querySelector('.lib-hero');

    // جوه القضية مفيش lib-hero، فمفيش بانر ولا كارت.
    if (!hero) return;

    // PC full banner
    if (!appRoot.querySelector('.bundle-home-banner')) {
      const fragment = tpl.content.cloneNode(true);
      const banner = fragment.querySelector('.banner');
      if (banner) {
        banner.classList.add('bundle-home-banner');
        hero.insertAdjacentElement('afterend', banner);
      }
    }

    // Mobile compact teaser: insert after hero and before full banner visually.
    if (!appRoot.querySelector('.bundle-mobile-teaser')) {
      const teaser = document.createElement('button');
      teaser.type = 'button';
      teaser.className = 'bundle-mobile-teaser';
      teaser.innerHTML = `
        <div class="bundle-mobile-teaser-top">
          <div>
            <div class="bundle-mobile-teaser-title">🎁 باقات القضايا</div>
            <div class="bundle-mobile-teaser-sub">Premium A و Premium B — شوف الباقات والخصومات</div>
          </div>
          <div class="bundle-mobile-teaser-arrow">←</div>
        </div>
      `;
      teaser.addEventListener('click', openMobileModal);

      const fullBanner = appRoot.querySelector('.bundle-home-banner');
      if (fullBanner) hero.insertAdjacentElement('afterend', teaser);
      else hero.insertAdjacentElement('afterend', teaser);
    }
  }

  placePackagesUnderLogo();

  // showLibrary() يعيد بناء #app، فارجع العناصر تلقائيًا بعد كل رجوع للأرشيف.
  const observer = new MutationObserver(function () {
    placePackagesUnderLogo();
  });

  observer.observe(appRoot, { childList: true });
})();
</script>
