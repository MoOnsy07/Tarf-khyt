<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>مفيش اتصال</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0A0C12;
    color: #EDE7DA;
    font-family: -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wrap {
    text-align: center;
    padding: 32px;
    max-width: 340px;
  }
  svg { width: 92px; height: 92px; margin-bottom: 22px; }
  h1 {
    font-size: 20px;
    margin: 0 0 10px;
    color: #EDE7DA;
  }
  p {
    font-size: 14px;
    line-height: 1.6;
    color: #9AA0AC;
    margin: 0 0 26px;
  }
  button {
    background: #E0A458;
    color: #0A0C12;
    border: none;
    border-radius: 999px;
    padding: 13px 34px;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  button:active { transform: scale(0.96); opacity: 0.85; }
</style>
</head>
<body>
  <div class="wrap">
    <svg viewBox="0 0 108 108" xmlns="http://www.w3.org/2000/svg">
      <path fill="none" stroke="#E0A458" stroke-width="4" stroke-linecap="round"
        d="M54,18 C31,18 18,35 18,54 C18,79 32,92 54,92 M54,29 C38,29 29,40 29,54 C29,75 39,82 54,82 M54,40 C45,40 40,46 40,54 C40,69 46,72 54,72 M54,18 C77,18 90,35 90,54 C90,78 77,92 59,92 M54,29 C70,29 79,40 79,54 C79,73 70,82 59,82 M54,40 C63,40 68,46 68,54 C68,67 63,72 59,72" />
      <path fill="none" stroke="#B3221C" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 5"
        d="M13,62 C36,52 69,57 96,47" />
    </svg>
    <h1>الخيط اتقطع مؤقتًا</h1>
    <p>مفيش اتصال بالإنترنت دلوقتي. اتأكد من الشبكة وجرّب تاني.</p>
    <button onclick="retry()">إعادة المحاولة</button>
  </div>
  <script>
    function retry() {
      if (window.NativeBridge && window.NativeBridge.retry) {
        window.NativeBridge.retry();
      } else {
        location.reload();
      }
    }
  </script>
</body>
</html>
