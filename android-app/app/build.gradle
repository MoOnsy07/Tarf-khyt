plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

def buildVersionCode = (System.getenv('ANDROID_VERSION_CODE') ?: '1') as Integer
def buildVersionName = System.getenv('ANDROID_VERSION_NAME') ?: '1.0.0'

android {
    namespace 'online.taraf5eet.app'
    compileSdk 36

    defaultConfig {
        applicationId 'online.taraf5eet.app'
        minSdk 23
        targetSdk 35
        versionCode buildVersionCode
        versionName buildVersionName
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
            def keystorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
            if (keystorePath && keystorePassword) {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias 'taraf5eet'
                keyPassword keystorePassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (System.getenv('ANDROID_KEYSTORE_PATH') && System.getenv('ANDROID_KEYSTORE_PASSWORD')) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.17.0')
    implementation 'com.google.firebase:firebase-messaging'
}
