<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>لوحة المتصدرين | طرف الخيط</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rakkas&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="leaderboard.js?v=20260825-3"></script>
<style>
:root{--bg:#0b0a09;--paper:#17140f;--paper2:#1f1b15;--thread:#b3221c;--thread2:#7a1712;--ink:#e8e2d4;--dim:#a89d87;--gold:#a8895a;--line:#322c22}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,sans-serif;min-height:100vh;padding:32px 16px 80px}.wrap{max-width:820px;margin:auto}header{text-align:center;margin-bottom:28px}.eyebrow{font-size:12px;letter-spacing:3px;color:var(--thread);font-weight:700}h1{font-family:Rakkas,serif;font-size:clamp(34px,7vw,52px);margin:8px 0 4px}.subtitle{color:var(--dim);font-size:14px}.thread{width:90px;height:2px;background:var(--thread);margin:18px auto 0}
.scope-tabs{display:flex;justify-content:center;gap:8px;margin:0 auto 18px}.scope-btn{border:1px solid var(--line);background:var(--paper);color:var(--dim);padding:9px 16px;border-radius:999px;font-family:Cairo;font-weight:800;cursor:pointer}.scope-btn.active{color:var(--ink);border-color:var(--gold);background:rgba(168,137,90,.1)}
.tabs{display:flex;gap:6px}.tab{flex:1;background:var(--paper);border:1px solid var(--line);border-bottom:0;color:var(--dim);font-family:Cairo;font-weight:700;padding:14px 8px;border-radius:10px 10px 0 0;cursor:pointer}.tab[aria-selected=true]{background:var(--paper2);color:var(--ink);box-shadow:0 -2px 0 var(--thread) inset}.panel{background:var(--paper2);border:1px solid var(--line);border-radius:0 0 12px 12px;padding:8px;min-height:320px}.case-select-row{padding:12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}.case-select-row select{flex:1;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:Cairo}.entry{display:flex;align-items:center;gap:12px;padding:14px 12px;border-bottom:1px solid var(--line)}.entry:last-child{border-bottom:0}.rank{width:34px;height:34px;flex:none;border-radius:50%;border:2px solid var(--thread2);display:flex;align-items:center;justify-content:center;font-family:Rakkas;font-size:15px;color:var(--gold)}.entry:nth-child(1) .rank{border-color:var(--gold);background:rgba(168,137,90,.1)}.avatar{width:42px;height:42px;flex:none;border-radius:50%;overflow:hidden;border:1px solid var(--line);background:#111;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--gold)}.avatar img{width:100%;height:100%;object-fit:cover;display:block}.entry-main{flex:1;min-width:0}.entry-name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.entry-meta{font-size:12px;color:var(--dim);margin-top:2px}.entry-value{font-family:Rakkas;font-size:20px;color:var(--thread);text-align:left;direction:ltr}.entry-value small{font-family:Cairo;font-size:11px;color:var(--dim);display:block;direction:rtl}.rank-title{display:inline-flex;margin-top:5px;padding:2px 8px;border:1px solid var(--line);border-radius:999px;font-size:10.5px;font-weight:800;color:var(--dim)}.rank-title-1{color:#e2c27f;border-color:rgba(226,194,127,.45)}.rank-title-2{color:#d8d0c2}.rank-title-3{color:#c78a5f}.state{text-align:center;padding:54px 20px;color:var(--dim);line-height:1.8}.notice{margin:0 0 12px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--dim);font-size:12.5px}.notice a{color:var(--gold)}
@media(max-width:520px){body{padding-inline:10px}.tab{font-size:12px;padding:12px 4px}.entry{gap:8px;padding-inline:8px}.avatar{width:36px;height:36px}.entry-value{font-size:17px}.scope-btn{padding:8px 12px}}
</style>
</head>
<body>
<div class="wrap">
<header><div class="eyebrow">CASE FILE — LEADERBOARD</div><h1>لوحة المتصدرين</h1><div class="subtitle">أقوى المحققين في طرف الخيط</div><div class="thread"></div></header>
<div class="scope-tabs"><button class="scope-btn active" data-scope="global">🌍 العالمي</button><button class="scope-btn" data-scope="friends">👥 أصدقائي</button></div>
<div id="scope-notice"></div>
<div class="tabs" role="tablist"><button class="tab" aria-selected="true" data-tab="cases">عدد القضايا</button><button class="tab" aria-selected="false" data-tab="points">إجمالي النقاط</button><button class="tab" aria-selected="false" data-tab="fastest">الأسرع</button></div>
<div class="panel" id="panel"><div class="state">🔍<br>بنراجع الملفات...</div></div>
</div>
<script>
const panel=document.getElementById('panel');
const tabs=[...document.querySelectorAll('.tab')];
const scopeBtns=[...document.querySelectorAll('.scope-btn')];
const notice=document.getElementById('scope-notice');
let activeTab='cases',scope='global',selectedCaseId='';
const titles=['المحقق الأسطوري','كبير المحققين','المحقق الخبير','المحقق المحترف','المحقق الصاعد'];
function esc(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML}
function initials(name){return esc(String(name||'؟').trim().charAt(0).toUpperCase()||'؟')}
function avatar(row){return row.avatar_url?`<div class="avatar"><img src="${esc(row.avatar_url)}" alt="" referrerpolicy="no-referrer"></div>`:`<div class="avatar">${initials(row.player_name)}</div>`}
function rankTitle(i){return titles[i]?`<div class="rank-title rank-title-${i+1}">${titles[i]}</div>`:''}
function loading(){panel.innerHTML='<div class="state">🔍<br>بنراجع الملفات...</div>'}
function empty(t){panel.innerHTML=`<div class="state">📁<br>${t}</div>`}
function fmt(sec){sec=Number(sec)||0;return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`}
async function checkScope(){notice.innerHTML='';if(scope!=='friends')return true;const session=await Leaderboard.getSession();if(!session){notice.innerHTML='<div class="notice">لازم تسجل دخول الأول عشان تشوف ترتيبك وسط أصحابك. <a href="profile.html">افتح ملف المحقق</a></div>';return false}const hasFb=await Leaderboard.hasFacebook();if(!hasFb){notice.innerHTML='<div class="notice">اربط Facebook من ملف المحقق عشان نعرف أصحابك اللي بيلعبوا طرف الخيط. <a href="profile.html">ربط Facebook</a></div>';return false}notice.innerHTML='<div class="notice">قائمة الأصدقاء تشمل فقط أصحابك على Facebook اللي سجلوا في طرف الخيط بنفس التطبيق.</div>';return true}
function renderRows(rows,type){if(!rows.length)return empty(scope==='friends'?'لسه مفيش أصحاب مستخدمين للعبة ظاهرين في الترتيب.':'لسه مفيش نتائج كفاية.');panel.innerHTML=rows.map((r,i)=>`<div class="entry"><div class="rank">${i+1}</div>${avatar(r)}<div class="entry-main"><div class="entry-name">${esc(r.player_name)}</div>${rankTitle(i)}<div class="entry-meta">${type==='cases'?`${r.total_points} نقطة إجمالي`:`${r.cases_solved} قضية محلولة`}</div></div><div class="entry-value">${type==='cases'?r.cases_solved:r.total_points}<small>${type==='cases'?'قضية':'نقطة'}</small></div></div>`).join('')}
async function loadFastest(){const cases=await Leaderboard.getCasesWithEntries();panel.innerHTML=`<div class="case-select-row"><label>القضية:</label><select id="picker"><option value="">اختار قضية</option>${cases.map(c=>`<option value="${esc(c.caseId)}">${esc(c.caseTitle)}</option>`).join('')}</select></div><div id="fastrows"></div>`;const picker=document.getElementById('picker');if(!selectedCaseId&&cases.length)selectedCaseId=cases[0].caseId;picker.value=selectedCaseId;async function go(){const box=document.getElementById('fastrows');if(!selectedCaseId){box.innerHTML='<div class="state">⏱️<br>اختار قضية.</div>';return}box.innerHTML='<div class="state">🔍<br>بنراجع الملفات...</div>';const rows=scope==='friends'?await Leaderboard.getFriendsFastestForCase(selectedCaseId):await Leaderboard.getFastestForCase(selectedCaseId);if(!rows.length){box.innerHTML='<div class="state">📁<br>لسه مفيش نتائج.</div>';return}box.innerHTML=rows.map((r,i)=>`<div class="entry"><div class="rank">${i+1}</div>${avatar(r)}<div class="entry-main"><div class="entry-name">${esc(r.player_name)}</div>${rankTitle(i)}<div class="entry-meta">${r.points} نقطة</div></div><div class="entry-value">${fmt(r.solve_time_seconds)}<small>دقيقة</small></div></div>`).join('')}picker.onchange=()=>{selectedCaseId=picker.value;go()};go()}
async function load(){loading();if(!(await checkScope()))return empty('فعّل ربط الحساب عشان تستخدم قائمة الأصدقاء.');if(activeTab==='cases'){const r=scope==='friends'?await Leaderboard.getFriendsByCasesSolved():await Leaderboard.getTopByCasesSolved();renderRows(r,'cases')}else if(activeTab==='points'){const r=scope==='friends'?await Leaderboard.getFriendsByTotalPoints():await Leaderboard.getTopByTotalPoints();renderRows(r,'points')}else await loadFastest()}
tabs.forEach(b=>b.onclick=()=>{tabs.forEach(x=>x.setAttribute('aria-selected','false'));b.setAttribute('aria-selected','true');activeTab=b.dataset.tab;load()});scopeBtns.forEach(b=>b.onclick=()=>{scopeBtns.forEach(x=>x.classList.remove('active'));b.classList.add('active');scope=b.dataset.scope;load()});load();
</script>
</body></html>
