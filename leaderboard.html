<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة المتصدرين | طرف الخيط</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rakkas&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="leaderboard.js"></script>

<style>
  :root {
    --bg: #0b0a09;
    --paper: #17140f;
    --paper-raised: #1f1b15;
    --thread: #b3221c;
    --thread-dim: #7a1712;
    --ink: #e8e2d4;
    --ink-dim: #a89d87;
    --gold: #a8895a;
    --line: #322c22;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse at 20% -10%, rgba(179,34,28,0.08), transparent 45%),
      radial-gradient(ellipse at 90% 110%, rgba(168,137,90,0.06), transparent 45%);
    color: var(--ink);
    font-family: 'Cairo', sans-serif;
    min-height: 100vh;
    padding: 32px 16px 80px;
  }

  .wrap {
    max-width: 780px;
    margin: 0 auto;
  }

  /* ===== الهيدر بشكل الختم ===== */
  header {
    text-align: center;
    margin-bottom: 36px;
    position: relative;
  }

  .eyebrow {
    font-size: 12px;
    letter-spacing: 3px;
    color: var(--thread);
    font-weight: 700;
    text-transform: uppercase;
  }

  h1 {
    font-family: 'Rakkas', serif;
    font-size: clamp(34px, 7vw, 52px);
    margin: 8px 0 4px;
    color: var(--ink);
    text-shadow: 0 0 24px rgba(179,34,28,0.25);
  }

  .subtitle {
    color: var(--ink-dim);
    font-size: 14px;
  }

  .thread-divider {
    width: 90px;
    height: 2px;
    background: var(--thread);
    margin: 18px auto 0;
    position: relative;
  }
  .thread-divider::before,
  .thread-divider::after {
    content: '';
    position: absolute;
    top: -3px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--thread);
  }
  .thread-divider::before { right: -4px; }
  .thread-divider::after { left: -4px; }

  /* ===== التابات ===== */
  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 0;
    position: relative;
    z-index: 2;
  }

  .tab {
    flex: 1;
    background: var(--paper);
    border: 1px solid var(--line);
    border-bottom: none;
    color: var(--ink-dim);
    font-family: 'Cairo', sans-serif;
    font-weight: 700;
    font-size: 14px;
    padding: 14px 8px;
    border-radius: 10px 10px 0 0;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .tab[aria-selected="true"] {
    background: var(--paper-raised);
    color: var(--ink);
    box-shadow: 0 -2px 0 var(--thread) inset;
  }

  .tab:hover:not([aria-selected="true"]) {
    color: var(--ink);
  }

  .tab:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: -2px;
  }

  /* ===== لوحة المحتوى ===== */
  .panel {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 0 0 12px 12px;
    padding: 8px;
    min-height: 320px;
  }

  .case-select-row {
    padding: 12px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .case-select-row label {
    font-size: 13px;
    color: var(--ink-dim);
    white-space: nowrap;
  }
  .case-select-row select {
    flex: 1;
    background: var(--paper);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
    font-family: 'Cairo', sans-serif;
    font-size: 13px;
  }

  /* ===== صفوف الترتيب ===== */
  .entry {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 12px;
    border-bottom: 1px solid var(--line);
  }
  .entry:last-child { border-bottom: none; }

  .rank {
    width: 34px;
    height: 34px;
    flex-shrink: 0;
    border-radius: 50%;
    border: 2px solid var(--thread-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Rakkas', serif;
    font-size: 15px;
    color: var(--gold);
  }
  .entry:nth-child(1) .rank { border-color: var(--gold); color: var(--gold); background: rgba(168,137,90,0.1); }
  .entry:nth-child(2) .rank { border-color: #b9b0a0; color: #d8d0c2; }
  .entry:nth-child(3) .rank { border-color: #8a5a3a; color: #c78a5f; }

  .entry-main {
    flex: 1;
    min-width: 0;
  }
  .entry-name {
    font-weight: 700;
    font-size: 15px;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .entry-meta {
    font-size: 12px;
    color: var(--ink-dim);
    margin-top: 2px;
  }

  .entry-value {
    font-family: 'Rakkas', serif;
    font-size: 20px;
    color: var(--thread);
    flex-shrink: 0;
    text-align: left;
    direction: ltr;
  }
  .entry-value small {
    font-family: 'Cairo', sans-serif;
    font-size: 11px;
    color: var(--ink-dim);
    display: block;
    text-align: right;
    direction: rtl;
  }

  /* ===== حالات فاضية / تحميل ===== */
  .state-message {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-dim);
    font-size: 14px;
    line-height: 1.8;
  }
  .state-message .stamp-icon {
    font-size: 32px;
    display: block;
    margin-bottom: 12px;
    opacity: 0.5;
  }

  @media (prefers-reduced-motion: no-preference) {
    .entry { animation: fadeIn 0.3s ease backwards; }
    .entry:nth-child(1) { animation-delay: 0.02s; }
    .entry:nth-child(2) { animation-delay: 0.05s; }
    .entry:nth-child(3) { animation-delay: 0.08s; }
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 480px) {
    .tab { font-size: 12px; padding: 12px 4px; }
    .entry-value { font-size: 17px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">CASE FILE — LEADERBOARD</div>
    <h1>لوحة المتصدرين</h1>
    <div class="subtitle">أقوى المحققين في طرف الخيط</div>
    <div class="thread-divider"></div>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-tab="cases">عدد القضايا</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="points">إجمالي النقاط</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="fastest">الأسرع</button>
  </div>

  <div class="panel" id="panel" role="tabpanel">
    <div class="state-message">
      <span class="stamp-icon">🔍</span>
      بنراجع الملفات...
    </div>
  </div>
</div>

<script>
  const panel = document.getElementById('panel');
  const tabs = document.querySelectorAll('.tab');
  let activeTab = 'cases';
  let selectedCaseId = '';

  function showLoading() {
    panel.innerHTML = `
      <div class="state-message">
        <span class="stamp-icon">🔍</span>
        بنراجع الملفات...
      </div>`;
  }

  function showEmpty(text) {
    panel.innerHTML = `
      <div class="state-message">
        <span class="stamp-icon">📁</span>
        ${text}
      </div>`;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }

  function formatTime(seconds) {
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    return `${m}:${String(s).padStart(2, '0')}`;
  }

  function renderCasesTab(rows) {
    if (!rows.length) return showEmpty('لسه محدش حل أي قضية بالكامل. كن أول محقق في الملف.');
    panel.innerHTML = rows.map((row, i) => `
      <div class="entry">
        <div class="rank">${i + 1}</div>
        <div class="entry-main">
          <div class="entry-name">${escapeHtml(row.player_name)}</div>
          <div class="entry-meta">${row.total_points} نقطة إجمالي</div>
        </div>
        <div class="entry-value">${row.cases_solved}<small>قضية</small></div>
      </div>
    `).join('');
  }

  function renderPointsTab(rows) {
    if (!rows.length) return showEmpty('لسه محدش سجّل نقاط. ابدأ أول قضية دلوقتي.');
    panel.innerHTML = rows.map((row, i) => `
      <div class="entry">
        <div class="rank">${i + 1}</div>
        <div class="entry-main">
          <div class="entry-name">${escapeHtml(row.player_name)}</div>
          <div class="entry-meta">${row.cases_solved} قضية محلولة</div>
        </div>
        <div class="entry-value">${row.total_points}<small>نقطة</small></div>
      </div>
    `).join('');
  }

  async function renderFastestTab() {
    const cases = await Leaderboard.getCasesWithEntries();

    let selectHtml = `
      <div class="case-select-row">
        <label for="case-picker">القضية:</label>
        <select id="case-picker">
          <option value="">اختار قضية</option>
          ${cases.map(c => `<option value="${escapeHtml(c.caseId)}" ${c.caseId === selectedCaseId ? 'selected' : ''}>${escapeHtml(c.caseTitle)}</option>`).join('')}
        </select>
      </div>
      <div id="fastest-rows"></div>
    `;
    panel.innerHTML = selectHtml;

    const picker = document.getElementById('case-picker');
    picker.addEventListener('change', () => {
      selectedCaseId = picker.value;
      loadFastestRows();
    });

    async function loadFastestRows() {
      const rowsContainer = document.getElementById('fastest-rows');
      if (!selectedCaseId) {
        rowsContainer.innerHTML = `<div class="state-message"><span class="stamp-icon">⏱️</span>اختار قضية من القايمة فوق عشان تشوف أسرع أوقات الحل.</div>`;
        return;
      }
      rowsContainer.innerHTML = `<div class="state-message"><span class="stamp-icon">🔍</span>بنراجع الملفات...</div>`;
      const rows = await Leaderboard.getFastestForCase(selectedCaseId);
      if (!rows.length) {
        rowsContainer.innerHTML = `<div class="state-message"><span class="stamp-icon">📁</span>لسه محدش حل القضية دي بالكامل.</div>`;
        return;
      }
      rowsContainer.innerHTML = rows.map((row, i) => `
        <div class="entry">
          <div class="rank">${i + 1}</div>
          <div class="entry-main">
            <div class="entry-name">${escapeHtml(row.player_name)}</div>
            <div class="entry-meta">${row.points} نقطة</div>
          </div>
          <div class="entry-value">${formatTime(row.solve_time_seconds)}<small>دقيقة</small></div>
        </div>
      `).join('');
    }

    if (cases.length && !selectedCaseId) {
      selectedCaseId = cases[0].caseId;
      picker.value = selectedCaseId;
    }
    loadFastestRows();
  }

  async function loadTab(tab) {
    showLoading();
    if (tab === 'cases') {
      const rows = await Leaderboard.getTopByCasesSolved();
      renderCasesTab(rows);
    } else if (tab === 'points') {
      const rows = await Leaderboard.getTopByTotalPoints();
      renderPointsTab(rows);
    } else if (tab === 'fastest') {
      renderFastestTab();
    }
  }

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.setAttribute('aria-selected', 'false'));
      tab.setAttribute('aria-selected', 'true');
      activeTab = tab.dataset.tab;
      loadTab(activeTab);
    });
  });

  loadTab(activeTab);
</script>

</body>
</html>
