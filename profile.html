<style>
  .pf-wrap{ max-width:820px; margin:0 auto; padding:34px 16px 70px; }

  .pf-back{
    display:inline-flex; align-items:center; gap:6px; color:var(--ink-dim);
    text-decoration:none; font-size:13px; margin-bottom:22px; transition:.15s;
  }
  .pf-back:hover{ color:var(--amber); }

  /* ===== بطاقة الهوية ===== */
  .pf-identity{
    display:flex; align-items:center; gap:16px; background:var(--panel);
    border:1px solid var(--line); border-radius:6px; padding:20px;
    margin-bottom:18px; flex-wrap:wrap;
  }
  .pf-avatar{
    flex:none; width:56px; height:56px; border-radius:50%;
    background:var(--amber); color:#1a1305; font-weight:900; font-size:22px;
    display:flex; align-items:center; justify-content:center;
  }
  .pf-identity-info{ flex:1; min-width:180px; }
  .pf-identity-info .label{ font-size:11px; color:var(--ink-dim); letter-spacing:.05em; margin-bottom:2px; }
  .pf-name-row{ display:flex; align-items:center; gap:8px; }
  .pf-name-row h2{ color:var(--ink); font-size:19px; font-weight:800; margin:0; }
  .pf-edit-name-btn{
    background:none; border:none; color:var(--amber); cursor:pointer;
    font-size:13px; font-family:'JetBrains Mono', monospace; padding:2px 6px;
  }
  .pf-edit-name-btn:hover{ text-decoration:underline; }
  .pf-name-edit{ display:none; align-items:center; gap:8px; margin-top:6px; }
  .pf-name-edit.active{ display:flex; }
  .pf-name-edit input{
    background:var(--void); border:1px solid var(--line); color:var(--ink);
    border-radius:3px; padding:8px 10px; font-family:'Tajawal', sans-serif; font-size:14px;
    flex:1; max-width:220px;
  }
  .pf-name-edit input:focus{ outline:none; border-color:var(--amber-dim); }

  /* ===== شبكة الإحصائيات ===== */
  .pf-stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:18px; }
  @media (max-width:560px){ .pf-stats{ grid-template-columns:1fr 1fr; } }
  .pf-stat-card{
    background:var(--panel); border:1px solid var(--line); border-radius:6px;
    padding:16px; text-align:center;
  }
  .pf-stat-card .num{
    font-family:'JetBrains Mono', monospace; font-size:26px; font-weight:800;
    color:var(--amber); text-shadow:var(--gold-glow);
  }
  .pf-stat-card .lbl{ font-size:12px; color:var(--ink-dim); margin-top:4px; }

  /* ===== قايمة القضايا ===== */
  .pf-section-title{
    display:flex; align-items:center; gap:8px; color:var(--ink); font-size:15px;
    font-weight:800; margin:22px 0 12px;
  }
  .pf-section-title .count{ color:var(--ink-dim); font-weight:500; font-size:13px; }

  .pf-case-row{
    display:flex; align-items:center; gap:12px; background:var(--panel-2);
    border:1px solid var(--line); border-radius:5px; padding:12px 14px; margin-bottom:8px;
  }
  .pf-case-cover{
    flex:none; width:44px; height:44px; border-radius:4px; overflow:hidden; background:var(--void);
  }
  .pf-case-cover img{ width:100%; height:100%; object-fit:cover; display:block; }
  .pf-case-info{ flex:1; min-width:0; }
  .pf-case-info .title{ color:var(--ink); font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pf-case-info .meta{ color:var(--ink-dim); font-size:11.5px; margin-top:2px; }
  .pf-case-info .location{ color:var(--signal); font-size:10.5px; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pf-case-badge{
    flex:none; font-family:'JetBrains Mono', monospace; font-size:11px; font-weight:700;
    padding:4px 10px; border-radius:20px; white-space:nowrap;
  }
  .badge-good{ background:rgba(120,200,140,.14); color:#8fd6a4; border:1px solid rgba(120,200,140,.35); }
  .badge-partial{ background:rgba(224,164,88,.14); color:var(--amber); border:1px solid var(--amber-dim); }
  .badge-bad{ background:rgba(198,90,78,.14); color:#e08a7c; border:1px solid rgba(198,90,78,.4); }
  .pf-case-link{
    flex:none; color:var(--amber); text-decoration:none; font-size:12.5px;
    font-family:'JetBrains Mono', monospace; white-space:nowrap;
  }
  .pf-case-link:hover{ text-decoration:underline; }

  .pf-empty{
    color:var(--ink-dim); font-size:13.5px; text-align:center; padding:22px 0;
  }

  .pf-cta{ display:flex; gap:10px; justify-content:center; margin-top:30px; flex-wrap:wrap; }
</style>

<script>
  const CASES_REGISTRY = [
    CASE_LAST_EPISODE, CASE_BUFFALO, CASE_DARK_TESTIMONY, CASE_LEAKED_VIDEO,
    CASE_MISSING_BRIDE, CASE_FINAL_TESTAMENT, CASE_93RD_MINUTE, CASE_BRIBERY,
    CASE_CHARITY_FUNDS, CASE_DELETED_SCENE, CASE_EXAM_LEAK, CASE_FAKE_AUDIO,
    CASE_FALSE_RUMOR, CASE_FORGED_CANVAS, CASE_GHOST_AUTHOR, CASE_HIT_AND_RUN,
    CASE_ILLUSION_STARTUP, CASE_LAST_CALL, CASE_LAST_DISH, CASE_LAST_REHEARSAL,
    CASE_LOST_WALLET, CASE_NO_WITNESS_NIGHT, CASE_NUMBER_19, CASE_ROLE_OF_LIFETIME,
    CASE_ROOM_307, CASE_SHIFTING_PAINTING, CASE_VANISHED_WIFE, CASE_VAR_CONSPIRACY,
    CASE_WEDDING_GOLD,
    CASE_BEHIND_SCENES, CASE_BROKEN_FAUCET, CASE_CLOSED_FILE, CASE_CODED_MESSAGE,
    CASE_DATING_APP, CASE_DAWN_CALL, CASE_DAWN_CLUB, CASE_FINISH_LINE,
    CASE_FLAT_12B, CASE_FORGED_WILL, CASE_GRANDMA_RING, CASE_LAST_BELL,
    CASE_LAST_LAUGH, CASE_LAST_UPDATE, CASE_MISSING_TWIN, CASE_MUD_PRINT,
    CASE_NILE_CRUISE, CASE_OLD_ESTATE, CASE_OLD_PHOTO, CASE_ONE_COMMENT,
    CASE_OPENING_NIGHT, CASE_OVERBILLED, CASE_POSTPONED_ENGAGEMENT, CASE_RECORDED_VOICE,
    CASE_RED_THREAD, CASE_SECOND_FACE, CASE_SECRET_CLINIC, CASE_SECRET_RECIPE,
    CASE_SUSPICIOUS_TRANSFER, CASE_VAULT_KEY, CASE_WAREHOUSE_FIRE,
  ];
</script>
<script src="ready-cases.js"></script>
<script src="case-locations.js"></script>

<script>
(function(){
  // ===== نفس مفاتيح localStorage اللي engine.js بيستخدمها بالظبط =====
  const PLAYER_NAME_KEY = 'ca_player_name';
  const LEGACY_PLAYER_NAME_KEY = 'tarafkhyt_player_name';

  function getPlayerName(){
    let name = localStorage.getItem(PLAYER_NAME_KEY);
    if(!name){
      name = localStorage.getItem(LEGACY_PLAYER_NAME_KEY);
      if(name) localStorage.setItem(PLAYER_NAME_KEY, name);
    }
    return name;
  }
  function setPlayerName(name){
    const cleanName = String(name || '').trim().replace(/\s+/g, ' ').slice(0,30);
    localStorage.setItem(PLAYER_NAME_KEY, cleanName);
    localStorage.setItem(LEGACY_PLAYER_NAME_KEY, cleanName);
    return cleanName;
  }
  function getUnlockedIds(){
    try { return JSON.parse(localStorage.getItem('ca_unlocked') || '[]'); }
    catch(e){ return []; }
  }
  function getCompletedIds(){
    try { return JSON.parse(localStorage.getItem('ca_completed') || '[]'); }
    catch(e){ return []; }
  }
  function loadLocalProgress(caseId){
    try { return JSON.parse(localStorage.getItem('ca_progress_'+caseId) || 'null'); }
    catch(e){ return null; }
  }
  function isCaseReady(c){
    return typeof READY_CASE_IDS !== 'undefined' && READY_CASE_IDS.has(c.id);
  }

  const endingLabels = { good:'نجحت في القضية', partial:'حل جزئي', bad:'اتهام غلط' };
  const endingBadgeClass = { good:'badge-good', partial:'badge-partial', bad:'badge-bad' };

  function render(){
    const root = document.getElementById('pf-root');
    const playerName = getPlayerName();
    const completedIds = getCompletedIds();

    const readyCases = CASES_REGISTRY.filter(isCaseReady);

    const completedList = readyCases
      .map(c => ({ c, progress: loadLocalProgress(c.id) }))
      .filter(x => x.progress && x.progress.ending);

    const inProgressList = readyCases
      .map(c => ({ c, progress: loadLocalProgress(c.id) }))
      .filter(x => x.progress && !x.progress.ending);

    const remainingCount = Math.max(0, readyCases.length - completedList.length - inProgressList.length);

    const initial = playerName ? playerName.trim().charAt(0).toUpperCase() : '؟';

    root.innerHTML = `
      <div class="pf-identity">
        <div class="pf-avatar mono">${initial}</div>
        <div class="pf-identity-info">
          <div class="label mono">المحقق</div>
          <div class="pf-name-row">
            <h2 id="pf-name-display">${playerName ? escapeHTML(playerName) : 'محقق مجهول'}</h2>
            <button class="pf-edit-name-btn mono" id="pf-edit-name-btn">تعديل ✎</button>
          </div>
          <div class="pf-name-edit" id="pf-name-edit">
            <input type="text" id="pf-name-input" maxlength="30" placeholder="اكتب اسمك..." value="${playerName ? escapeHTML(playerName) : ''}">
            <button class="btn mono" id="pf-name-save" style="padding:8px 16px; font-size:12.5px;">حفظ</button>
            <button class="btn ghost mono" id="pf-name-cancel" style="padding:8px 12px; font-size:12.5px;">إلغاء</button>
          </div>
        </div>
      </div>

      <div class="pf-stats">
        <div class="pf-stat-card">
          <div class="num mono">${completedList.length}</div>
          <div class="lbl">قضية اتحلّت</div>
        </div>
        <div class="pf-stat-card">
          <div class="num mono">${remainingCount}</div>
          <div class="lbl">لسه فاضلة</div>
        </div>
        <div class="pf-stat-card">
          <div class="num mono">${readyCases.length}</div>
          <div class="lbl">قضية مجانية جاهزة</div>
        </div>
      </div>

      ${inProgressList.length ? `
        <div class="pf-section-title">🕵️ قيد التحقيق <span class="count mono">(${inProgressList.length})</span></div>
        ${inProgressList.map(({c, progress}) => {
          const pct = c.evidence && c.evidence.length ? Math.round(((progress.collected||[]).length / c.evidence.length) * 100) : 0;
          return `
          <div class="pf-case-row">
            <div class="pf-case-cover"><img src="${c.coverImg}" alt="${escapeHTML(c.title)}" loading="lazy"></div>
            <div class="pf-case-info">
              <div class="title">${escapeHTML(c.title)}</div>
              <div class="meta mono">${c.caseNo} · ${pct}% أدلة</div>
              <div class="location">📍 ${escapeHTML(caseLocationText(c))}</div>
            </div>
            <a class="pf-case-link" href="index.html?case=${encodeURIComponent(c.id)}">استكمل ←</a>
          </div>`;
        }).join('')}
      ` : ''}

      <div class="pf-section-title">✅ قضايا اتحلّت <span class="count mono">(${completedList.length})</span></div>
      ${completedList.length ? completedList.map(({c, progress}) => `
        <div class="pf-case-row">
          <div class="pf-case-cover"><img src="${c.coverImg}" alt="${escapeHTML(c.title)}" loading="lazy"></div>
          <div class="pf-case-info">
            <div class="title">${escapeHTML(c.title)}</div>
            <div class="meta mono">${c.caseNo}</div>
            <div class="location">📍 ${escapeHTML(caseLocationText(c))}</div>
          </div>
          <span class="pf-case-badge ${endingBadgeClass[progress.ending] || 'badge-partial'} mono">${endingLabels[progress.ending] || 'مكتملة'}</span>
        </div>
      `).join('') : `<div class="pf-empty">لسه معملتش أي قضية. <a href="index.html" style="color:var(--amber);">ابدأ أول قضية →</a></div>`}
    `;

    // ------- تعديل الاسم -------
    const editBtn = document.getElementById('pf-edit-name-btn');
    const editBox = document.getElementById('pf-name-edit');
    const nameInput = document.getElementById('pf-name-input');
    const saveBtn = document.getElementById('pf-name-save');
    const cancelBtn = document.getElementById('pf-name-cancel');

    editBtn.addEventListener('click', ()=>{
      editBox.classList.add('active');
      nameInput.focus();
    });
    cancelBtn.addEventListener('click', ()=>{
      editBox.classList.remove('active');
    });
    saveBtn.addEventListener('click', ()=>{
      const val = nameInput.value.trim();
      if(val.length < 2){
        nameInput.focus();
        return;
      }
      setPlayerName(val);
      render();
    });
    nameInput.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter') saveBtn.click();
      if(e.key === 'Escape') cancelBtn.click();
    });
  }

  function escapeHTML(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  render();
})();
</script>
